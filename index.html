    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Dynamic viewport units track collapsing mobile browser chrome; the
           100% above stays as the fallback for browsers without dvh. */
        height: 100dvh;
        width: 100%;
        font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background-color: #f6f8fa;
        color: #1f2328;
        overflow: hidden;
        /* Suppress rubber-band scroll and pull-to-refresh so the installed app
           does not bounce the whole shell while panning a comic strip. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
